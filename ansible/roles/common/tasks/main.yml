---
# Baseline setup for Ubuntu Jammy

- name: Force a completely fresh apt repository sync
  ansible.builtin.apt:
    update_cache: yes
    force_apt_get: yes
  become: true
  check_mode: no  # <-- Forces the dry-run to actually build the cache map

- name: Ensure common packages are installed
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: sudo
    shell: /bin/bash
    createhome: yes
    state: present
  become: true

- name: Ensure .ssh directory exists for deploy user
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0700'
  become: true

- name: Install authorized keys for deploy user
  ansible.builtin.copy:
    src: authorized_keys
    dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
  become: true