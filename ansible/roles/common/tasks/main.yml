---
# Baseline setup for Ubuntu Jammy

- name: Force a completely fresh apt repository sync
  ansible.builtin.apt:
    update_cache: true
    force_apt_get: true
  become: true
  check_mode: false # <-- Forces the dry-run to actually build the cache map

- name: Ensure common packages are installed
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  become: true

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ common_deploy_user }}"
    groups: sudo
    shell: /bin/bash
    createhome: true
    state: present
  become: true

- name: Ensure .ssh directory exists for deploy user
  ansible.builtin.file:
    path: /home/{{ common_deploy_user }}/.ssh
    state: directory
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0700"
  become: true

- name: Install authorized keys for deploy user
  ansible.builtin.copy:
    src: authorized_keys
    dest: /home/{{ common_deploy_user }}/.ssh/authorized_keys
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0600"
  become: true
