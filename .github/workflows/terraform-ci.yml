name: Terraform & Ansible CI

on:
  push:
    branches: [ main, master, '**/feature/**', '**/bugfix/**' ]

jobs:
  # 1. The dedicated Setup Job
  setup:
    name: terraform-setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Show terraform version
        run: terraform -version

  # 2. Parallel Job: Format Check
  fmt:
    name: terraform-fmt
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

  # 3. Parallel Job: Validation
  validate:
    name: terraform-validate
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # 4. Parallel Job: Security Scan
  tfsec:
    name: terraform-tfsec
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec security scan (docker)
        run: |
          docker run --rm -v "${{ github.workspace }}/terraform":/src aquasec/tfsec:latest /src

  # 5. Parallel Job: Ansible Lint
  ansible-lint:
    name: ansible-lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ansible Lint
        uses: ansible/ansible-lint-action@v6
        # Optional: points to your ansible directory if it's not at the root
        # with:
        #   targets: "ansible/" 

  # 6. Conditional Job: Terraform Plan (Runs ONLY on main/master branches)
  plan:
    name: terraform-plan
    # Only run if setup succeeds AND the branch is main or master
    needs: setup
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      # Note: For a real plan, you will need your cloud credentials 
      # configured here (e.g., AWS, Azure, GCP secrets)
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan